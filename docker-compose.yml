services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file:
      - .env
    networks:
      - rede-sistema
    volumes:
      - volume-mysql:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
  api-java1:
    build:
      context: .
      dockerfile: api.dockerfile
    container_name: api-java1
    env_file:
      - .env
    environment:
      INSTANCE_ID: api-java1
    ports:
      - "8081:8080"
    networks:
      - rede-sistema
    depends_on:
      mysql:
        condition: service_healthy
  api-java2:
    build:
      context: .
      dockerfile: api.dockerfile
    container_name: api-java2
    env_file:
      - .env
    environment:
      INSTANCE_ID: api-java2
    ports:
      - "8082:8080"
    networks:
      - rede-sistema
    depends_on:
       mysql:
         condition: service_healthy
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    networks:
      - rede-sistema
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api-java1
      - api-java2
networks:
  rede-sistema:
    driver: bridge
volumes:
  volume-mysql:
    driver: local
